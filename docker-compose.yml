services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slatebook
      POSTGRES_PASSWORD: slatebook
      POSTGRES_DB: slatebook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slatebook"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
